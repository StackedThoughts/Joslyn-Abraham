
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200"
     height="340"
     viewBox="0 0 1200 340">

  <title>AI × Engineering</title>
  <desc>
    A dark minimal engineering wordmark with a continuously
    morphing geometric shape.
  </desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D6C7FF"/>
      <stop offset="100%" stop-color="#9274D8"/>
    </linearGradient>

    <linearGradient id="textAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6C7FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="18" fill="#0B0C10"/>

  <!-- Subtle border -->
  <rect x="1" y="1" width="1198" height="338"
        rx="17" fill="none"
        stroke="#282831" stroke-width="1"/>

  <!-- Top label -->
  <text x="85" y="65"
        fill="#777783"
        font-family="monospace"
        font-size="13"
        letter-spacing="3">
    SOFTWARE ENGINEERING / ARTIFICIAL INTELLIGENCE
  </text>

  <!-- Main wordmark -->
  <text x="82" y="165"
        fill="#F4F3F8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="88"
        font-weight="700"
        letter-spacing="-5">
    AI ×
  </text>

  <text x="87" y="225"
        fill="url(#textAccent)"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="600"
        letter-spacing="1">
    ENGINEERING
  </text>

  <!-- Description -->
  <text x="89" y="270"
        fill="#777783"
        font-family="monospace"
        font-size="13"
        letter-spacing="2">
    BUILDING INTELLIGENT SYSTEMS
  </text>

  <!-- Morphing shape -->
  <g transform="translate(955 165)">

    <!-- Main morph -->
    <path fill="url(#accent)" opacity="0.92"
          d="
          M 0 -54
          C 29.8 -54 54 -29.8 54 0
          C 54 29.8 29.8 54 0 54
          C -29.8 54 -54 29.8 -54 0
          C -54 -29.8 -29.8 -54 0 -54 Z">

      <animate attributeName="d"
        dur="14s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="
          0.4 0 0.2 1;
          0.4 0 0.2 1;
          0.4 0 0.2 1;
          0.4 0 0.2 1;
          0.4 0 0.2 1;
          0.4 0 0.2 1"
        values="
          M 0 -54 C 29.8 -54 54 -29.8 54 0 C 54 29.8 29.8 54 0 54 C -29.8 54 -54 29.8 -54 0 C -54 -29.8 -29.8 -54 0 -54 Z;

          M 0 -68 C 13 -68 68 -13 68 0 C 68 13 13 68 0 68 C -13 68 -68 13 -68 0 C -68 -13 -13 -68 0 -68 Z;

          M 0 -58 C 32 -58 58 -32 58 0 C 58 32 32 58 0 58 C -32 58 -58 32 -58 0 C -58 -32 -32 -58 0 -58 Z;

          M 0 -42 C 55 -42 72 -22 72 0 C 72 22 55 42 0 42 C -55 42 -72 22 -72 0 C -72 -22 -55 -42 0 -42 Z;

          M 0 -72 C 22 -72 42 -55 42 0 C 42 55 22 72 0 72 C -22 72 -42 55 -42 0 C -42 -55 -22 -72 0 -72 Z;

          M 0 -62 C 36 -70 62 -26 52 0 C 64 34 24 64 0 48 C -32 68 -62 28 -48 0 C -62 -32 -26 -62 0 -62 Z;

          M 0 -54 C 29.8 -54 54 -29.8 54 0 C 54 29.8 29.8 54 0 54 C -29.8 54 -54 29.8 -54 0 C -54 -29.8 -29.8 -54 0 -54 Z
        "/>
    </path>

    <!-- Rotating outline -->
    <path
      d="
        M 0 -83
        C 45 -83 83 -45 83 0
        C 83 45 45 83 0 83
        C -45 83 -83 45 -83 0
        C -83 -45 -45 -83 0 -83 Z"
      fill="none"
      stroke="#B8A5ED"
      stroke-width="1.5"
      stroke-dasharray="4 8"
      opacity="0.7">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="60s"
        repeatCount="indefinite"/>
    </path>

    <!-- Center point -->
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>

  </g>

  <!-- Bottom label -->
  <text x="88" y="318"
        fill="#555560"
        font-family="monospace"
        font-size="10"
        letter-spacing="2">
    LEARN / BUILD / UNDERSTAND
  </text>

  <text x="1110" y="318"
        fill="#555560"
        font-family="monospace"
        font-size="10"
        text-anchor="end">
    001 / AI
  </text>

</svg>
